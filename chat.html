<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Chat — Watcher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0a0f1e;
      --bg2:      #111827;
      --bg3:      #1e293b;
      --bg4:      #243044;
      --border:   #1e2d45;
      --text:     #e2e8f0;
      --text2:    #94a3b8;
      --text3:    #64748b;
      --accent:   #38bdf8;
      --green:    #22c55e;
      --purple:   #a855f7;
      --radius:   10px;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      font-size: 15px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-link {
      color: var(--text2);
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }
    .header h1 { font-size: 1rem; font-weight: 600; }
    .model-badge {
      font-size: 0.72rem;
      background: rgba(168,85,247,0.15);
      color: var(--purple);
      border: 1px solid rgba(168,85,247,0.3);
      padding: 3px 10px;
      border-radius: 999px;
    }

    /* ── Messages area ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      display: flex;
      gap: 12px;
      max-width: 100%;
    }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .msg.user  .avatar { background: var(--accent);  color: #0a0f1e; }
    .msg.assistant .avatar { background: var(--purple); color: #fff; }
    .bubble {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      line-height: 1.65;
      max-width: 78%;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
    }
    .msg.user .bubble {
      background: rgba(56,189,248,0.1);
      border-color: rgba(56,189,248,0.25);
    }
    .bubble code {
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 5px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.85em;
    }
    .bubble pre {
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85em;
    }

    /* typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 14px 18px;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--text3);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text3);
      text-align: center;
      padding: 40px;
    }
    .empty-state svg { opacity: 0.3; }
    .empty-state p { font-size: 0.9rem; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }
    .suggestion {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      color: var(--text2);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .suggestion:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Input bar ── */
    .input-bar {
      flex-shrink: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
    }
    .input-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-wrap {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: flex-end;
      padding: 2px 4px 2px 14px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }
    textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      resize: none;
      padding: 9px 0;
      max-height: 160px;
      line-height: 1.5;
    }
    textarea::placeholder { color: var(--text3); }
    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 7px;
      width: 36px;
      height: 36px;
      margin-bottom: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-btn svg { color: #0a0f1e; }
    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      color: var(--text3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .clear-btn:hover { border-color: var(--text2); color: var(--text); }
    .hint { font-size: 0.72rem; color: var(--text3); text-align: center; margin-top: 8px; max-width: 860px; margin-left: auto; margin-right: auto; }

    /* ── Timestamps ── */
    .msg-body { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
    .msg.user .msg-body { align-items: flex-end; }
    .msg.assistant .msg-body { align-items: flex-start; }
    .msg-body .bubble { max-width: 100%; }
    .msg-time {
      font-size: 0.68rem;
      color: var(--text3);
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="../index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>
      <h1>Ollama Chat</h1>
    </div>
    <span class="model-badge" id="model-badge">llama3.2:3b</span>
  </header>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Send a message to start chatting with <strong>llama3.2:3b</strong></p>
      <div class="suggestions">
        <button class="suggestion">Explain quantum computing simply</button>
        <button class="suggestion">Write a Python hello world</button>
        <button class="suggestion">What is KLSE?</button>
        <button class="suggestion">Summarise the news today</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-inner">
      <button class="clear-btn" id="clear-btn" title="Clear conversation">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
      </div>
      <button class="send-btn" id="send-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <p class="hint">Responses are generated by a local Ollama LLM and may be inaccurate.</p>
  </div>

<script>
(function () {
  'use strict';

  const MODEL   = 'llama3.2:3b';
  const msgList = document.getElementById('messages');
  const input   = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const clearBtn= document.getElementById('clear-btn');
  const empty   = document.getElementById('empty-state');

  // Conversation history sent to API for multi-turn context
  const history = [];

  // ── Auto-grow textarea ────────────────────────────────────────────────
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    sendBtn.disabled = input.value.trim() === '';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) send();
    }
  });

  // ── Suggestion chips ──────────────────────────────────────────────────
  document.querySelectorAll('.suggestion').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.textContent;
      input.dispatchEvent(new Event('input'));
      input.focus();
    });
  });

  // ── Clear conversation ─────────────────────────────────────────────────
  clearBtn.addEventListener('click', () => {
    history.length = 0;
    // Remove all messages except the empty state placeholder
    Array.from(msgList.children).forEach(el => {
      if (el.id !== 'empty-state') el.remove();
    });
    empty.style.display = '';
  });

  // ── Format HH:MM timestamp ─────────────────────────────────────────────
  function nowTime() {
    return new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  // ── Append a chat bubble ───────────────────────────────────────────────
  function appendMsg(role, text) {
    empty.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'You' : 'AI';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatText(text);

    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = nowTime();

    body.appendChild(bubble);
    body.appendChild(time);
    wrap.appendChild(avatar);
    wrap.appendChild(body);
    msgList.appendChild(wrap);
    msgList.scrollTop = msgList.scrollHeight;
    return bubble;
  }

  // ── Typing indicator ───────────────────────────────────────────────────
  function showTyping() {
    empty.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant typing';
    wrap.id = 'typing-indicator';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    msgList.appendChild(wrap);
    msgList.scrollTop = msgList.scrollHeight;
  }

  function removeTyping() {
    document.getElementById('typing-indicator')?.remove();
  }

  // ── Basic markdown-ish formatting ──────────────────────────────────────
  function formatText(text) {
    // Escape HTML first
    let s = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // Code blocks ```lang\ncode```
    s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
      `<pre><code>${code.trimEnd()}</code></pre>`);

    // Inline code
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Bold **text**
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // Newlines → <br> (outside pre blocks — done via white-space:pre-wrap)
    return s;
  }

  // ── Send message ───────────────────────────────────────────────────────
  async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    appendMsg('user', text);
    history.push({ role: 'user', content: text });

    showTyping();

    try {
      const res = await fetch('api/chat.php', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          message: text,
          model:   MODEL,
          // Send last 10 turns for context window, excluding the latest user msg
          history: history.slice(-11, -1),
        }),
        signal: AbortSignal.timeout(300000),
      });

      removeTyping();

      const data = await res.json();

      if (!res.ok || data.error) {
        appendMsg('assistant', '⚠ Error: ' + (data.error || 'Unknown error'));
        history.pop(); // remove failed user message from history
        return;
      }

      appendMsg('assistant', data.reply);
      history.push({ role: 'assistant', content: data.reply });

    } catch (err) {
      removeTyping();
      const msg = err.name === 'TimeoutError'
        ? '⚠ Request timed out (>120s). The model may be busy.'
        : '⚠ Network error: ' + err.message;
      appendMsg('assistant', msg);
      history.pop();
    }
  }

  sendBtn.addEventListener('click', send);
})();
</script>
</body>
</html>
